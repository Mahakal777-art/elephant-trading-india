services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: elephant
      POSTGRES_PASSWORD: test-password
      POSTGRES_DB: elephant_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elephant -d elephant_test"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    environment:
      APP_ENV: test
      SECRET_KEY: ci-only-secret-key-012345678901234567890123456789
      DATABASE_URL: postgresql+psycopg://elephant:test-password@postgres:5432/elephant_test
      DATABASE_URL_POOLED: ""
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      CUSTOMER_EMAILS_ENABLED: "false"
      FOLLOWUPS_ENABLED: "false"
      COOKIE_SECURE: "false"
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
