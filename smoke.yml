name: Production read-only smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check smoke configuration
        id: gate
        shell: bash
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          SMOKE_ADMIN_USERNAME: ${{ secrets.SMOKE_ADMIN_USERNAME }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
        run: |
          missing=()
          [[ -n "$PRODUCTION_BASE_URL" ]] || missing+=("PRODUCTION_BASE_URL repository variable")
          [[ -n "$SMOKE_ADMIN_USERNAME" ]] || missing+=("SMOKE_ADMIN_USERNAME")
          [[ -n "$SMOKE_ADMIN_PASSWORD" ]] || missing+=("SMOKE_ADMIN_PASSWORD")
          if (( ${#missing[@]} )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "SKIPPED: production read-only smoke requires ${missing[*]}"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Smoke configuration is present."
          fi

      - name: Checkout
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        if: steps.gate.outputs.ready == 'true'
        run: python -m pip install requests

      - name: Smoke test HTTPS public pages, Turnstile fail-closed and admin login/logout
        if: steps.gate.outputs.ready == 'true'
        env:
          SMOKE_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          SMOKE_ADMIN_USERNAME: ${{ secrets.SMOKE_ADMIN_USERNAME }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
        run: python scripts/smoke_test.py

      - name: Explain skipped smoke
        if: steps.gate.outputs.ready != 'true'
        run: echo "Production smoke skipped safely; no production request was sent."
